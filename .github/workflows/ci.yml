name: Java and Flutter CI

on:
  push:
    branches: [ "main", "prod", "test" ]
  pull_request:
    branches: [ "main", "prod", "test" ]


jobs:
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend-Java
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-jar
        path: Backend-Java/target/backend-0.0.1-SNAPSHOT.jar

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.38.5'
        cache: true
    - name: Install dependencies
      run: flutter pub get
      working-directory: FrontEnd/flutter_application
    - name: Analyze project
      run: flutter analyze
      working-directory: FrontEnd/flutter_application
    - name: Set Gradle Wrapper permissions
      run: chmod +x gradlew
      working-directory: FrontEnd/flutter_application/android
    - name: Build App Bundle with Gradle
      run: ./gradlew app:bundleRelease --no-daemon
      working-directory: FrontEnd/flutter_application/android
    - name: Verify AAB
      run: |
        echo "Searching for AAB..."
        find . -name "*.aab"
        ls -l FrontEnd/flutter_application/android/app/build/outputs/bundle/release/

  deploy-frontend:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    needs: [build-frontend]
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true
      - name: Build Flutter Web
        run: |
          flutter build web --dart-define=FIREBASE_WEB_API_KEY=${{ secrets.FIREBASE_WEB_API_KEY }}
        working-directory: ./FrontEnd/flutter_application
      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/476285489549/locations/global/workloadIdentityPools/githubpool/providers/githubprovider'
          service_account: 'firebase-adminsdk-fbsvc@acadexa-484807.iam.gserviceaccount.com'
      - name: Deploy to Firebase Hosting
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project acadexa-484807 --non-interactive

  deploy-backend:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    needs: [build-backend]
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@v3
      - name: Download Backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: Backend-Java/target
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        working-directory: Backend-Java
        run: |
          docker build --no-cache -t shamanthts/majorproject-application-image:${{ github.sha }} .
          docker tag shamanthts/majorproject-application-image:${{ github.sha }} shamanthts/majorproject-application-image:latest
          docker push shamanthts/majorproject-application-image --all-tags
      - name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/476285489549/locations/global/workloadIdentityPools/githubpool/providers/githubprovider'
          service_account: 'github-actions-deployer@acadexa-484807.iam.gserviceaccount.com'

      - name: 'Deploy to Cloud Run'
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: 'acadexa-backend'
          region: 'us-central1'
          image: 'docker.io/shamanthts/majorproject-application-image:latest'
          flags: '--allow-unauthenticated --service-account=github-actions-deployer@acadexa-484807.iam.gserviceaccount.com'

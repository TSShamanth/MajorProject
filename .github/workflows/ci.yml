name: Java and Flutter CI

on:
  push:
    branches: [ "main", "prod", "test" ]
  pull_request:
    branches: [ "main", "prod", "test" ]


jobs:
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend-Java
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-jar
        path: Backend-Java/target/backend-0.0.1-SNAPSHOT.jar

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.38.5'
        cache: true
    - name: Install dependencies
      run: flutter pub get
      working-directory: FrontEnd/flutter_application
    - name: Analyze project
      run: flutter analyze
      working-directory: FrontEnd/flutter_application
    - name: Set Gradle Wrapper permissions
      run: chmod +x gradlew
      working-directory: FrontEnd/flutter_application/android
    - name: Build App Bundle with Gradle
      run: ./gradlew app:bundleRelease --no-daemon
      working-directory: FrontEnd/flutter_application/android
    - name: Verify AAB
      run: |
        echo "Searching for AAB..."
        find . -name "*.aab"
        ls -l FrontEnd/flutter_application/android/app/build/outputs/bundle/release/

  deploy-frontend:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v3

      # Container Creation Flow
      - name: Download Backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: Backend-Java/target
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        working-directory: Backend-Java
        run: |
          docker build --no-cache -t shamanthts/majorproject-application-image:${{ github.sha }} .
          docker tag shamanthts/majorproject-application-image:${{ github.sha }} shamanthts/majorproject-application-image:latest
          docker push shamanthts/majorproject-application-image --all-tags
      
      # Frontend Deployment Flow
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true
      - name: Build Flutter Web
        run: |
          flutter build web --dart-define=FIREBASE_WEB_API_KEY=${{ secrets.FIREBASE_WEB_API_KEY }}
        working-directory: ./FrontEnd/flutter_application
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAJORSAMPLE_2ED21 }}'
          channelId: live
          projectId: majorsample-2ed21

  deploy-backend:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    needs: deploy-frontend # Runs after the frontend job (which pushes the image)
    steps:
      - name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Deploy to Cloud Run'
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: 'acadexa-backend' # You can change this name
          region: 'us-central1' # You can change this to a region closer to you
          image: 'docker.io/shamanthts/majorproject-application-image:latest'
          project_id: '${{ secrets.GCP_PROJECT_ID }}'
          flags: '--allow-unauthenticated --service-account=firebase-adminsdk-fbsvc@majorsample-2ed21.iam.gserviceaccount.com'
